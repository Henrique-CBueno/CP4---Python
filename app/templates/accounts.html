<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contas — Banco Digital Acadêmico</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1><a href="/" class="brand">Banco Digital Acadêmico</a></h1>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/customers" data-admin-only>Clientes</a>
        <a href="/accounts">Contas</a>
        <a href="/pix/transfer">Transferência Pix</a>
        <span id="current-user"></span>
        <button id="logout-button" type="button">Sair</button>
      </nav>
    </header>

    <main>
      <h2>Contas</h2>
      <div id="accounts-error" class="alert alert-error" hidden></div>

      <form id="account-form" class="card" data-admin-only>
        <label>
          Cliente
          <select name="customer_id" required></select>
        </label>
        <label>Agência <input type="text" name="agency" required /></label>
        <label>Número <input type="text" name="number" required /></label>
        <label>Apelido <input type="text" name="label" /></label>
        <button type="submit">Cadastrar</button>
      </form>

      <dialog id="account-edit-modal" class="modal">
        <form id="account-edit-form" class="modal-content">
          <div class="modal-header">
            <h3>Editar conta</h3>
            <button type="button" class="modal-close" aria-label="Fechar">×</button>
          </div>
          <input type="hidden" name="id" />
          <label>Agência <input type="text" name="agency" required /></label>
          <label>Apelido <input type="text" name="label" /></label>
          <div class="modal-actions">
            <button type="button" class="button-secondary" data-modal-cancel>Cancelar</button>
            <button type="submit">Salvar alterações</button>
          </div>
        </form>
      </dialog>

      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Agência</th>
            <th>Número</th>
            <th>Apelido</th>
            <th>Saldo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="accounts-list"></tbody>
      </table>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/accounts.js?v=modal-1"></script>
  </body>
</html>
