<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Detalhe da Conta — Banco Digital Acadêmico</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body data-account-id="{{ account_id }}">
    <header class="topbar">
      <h1>Banco Digital Acadêmico</h1>
      <nav>
        <a href="/customers">Clientes</a>
        <a href="/accounts">Contas</a>
      </nav>
    </header>

    <main>
      <h2>Conta #{{ account_id }}</h2>
      <div id="account-detail-error" class="alert alert-error" hidden></div>

      <section class="card" id="account-info"></section>

      <section>
        <h3>Depósito</h3>
        <form id="deposit-form" class="card">
          <label>Valor (R$) <input type="number" name="amount" step="0.01" min="0.01" required /></label>
          <button type="submit">Depositar</button>
        </form>
      </section>

      <section>
        <h3>Saque</h3>
        <form id="withdraw-form" class="card">
          <label>Valor (R$) <input type="number" name="amount" step="0.01" min="0.01" required /></label>
          <button type="submit">Sacar</button>
        </form>
      </section>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/account_detail.js"></script>
  </body>
</html>
