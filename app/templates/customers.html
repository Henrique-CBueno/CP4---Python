<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Clientes — Banco Digital Acadêmico</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Banco Digital Acadêmico</h1>
      <nav>
        <a href="/customers">Clientes</a>
        <a href="/accounts">Contas</a>
        <a href="/pix/transfer">Transferência Pix</a>
      </nav>
    </header>

    <main>
      <h2>Clientes</h2>
      <div id="customers-error" class="alert alert-error" hidden></div>

      <form id="customer-form" class="card">
        <input type="hidden" id="customer-editing-id" value="" />
        <label>Nome <input type="text" name="name" required /></label>
        <label>Email <input type="email" name="email" required /></label>
        <label>CPF <input type="text" name="cpf" required maxlength="11" /></label>
        <button type="submit">Cadastrar</button>
      </form>

      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>CPF</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="customers-list"></tbody>
      </table>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/customers.js"></script>
  </body>
</html>
